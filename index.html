<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090f20"><title>Genesis Universe V1.0</title><style>*{box-sizing:border-box}body{margin:0;background:#090f20;color:#edf3ff;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{padding:18px 16px;background:#111c34;position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}small,.muted{color:#a8b8d3}main{max-width:950px;margin:auto;padding:12px}canvas{display:block;width:100%;height:370px;background:#030918;border:1px solid #273a5c;border-radius:15px;touch-action:none}.panel{background:#17243e;border:1px solid #2c4166;border-radius:15px;padding:14px;margin:12px 0}h2{font-size:17px;margin:0 0 12px}button,select,input{font:inherit}button,select{background:#2b426a;color:white;border:1px solid #55709b;border-radius:10px;padding:10px;margin:3px 3px 3px 0}button:active{background:#556ac1}.primary{background:#6555d6}button:disabled{opacity:.45}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat>div{background:#0e1930;border-radius:9px;padding:10px}.stat b{display:block;font-size:18px;margin-top:3px}.pill{background:#314b70;border-radius:20px;padding:5px 9px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.controls label{display:block}.controls input{width:100%;accent-color:#8c80f6}.log{max-height:170px;overflow:auto;font-size:13px;color:#c2d5f1}.log div{border-bottom:1px solid #2c4166;padding:6px 0}.species{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.species article{background:#0c1931;border-radius:10px;padding:10px}.species strong{color:#c0e6ff}footer{padding:20px;text-align:center;color:#8899b8;font-size:12px}#planet{height:350px}@media(min-width:700px){.stat{grid-template-columns:repeat(4,1fr)}.species{grid-template-columns:repeat(3,1fr)}} </style></head><body><header><div><h1>✦ Genesis Universe <small>V1.0</small></h1><small>即時宇宙・生命演化沙盒</small></div><span id="status" class="pill">● 運轉中</span></header><main><div class="panel"><div class="row"><button id="spaceBtn" class="primary">☀ 星系視角</button><button id="surfaceBtn">🌍 星球生態</button><button id="pause">⏸ 暫停</button><select id="speed"><option value="1">×1</option><option value="100">×100</option><option value="10000" selected>×1萬</option><option value="1000000">×100萬</option><option value="100000000">×1億</option></select></div><p class="muted" id="hint">拖曳平移、雙指縮放，點選行星進入詳細觀察。</p><canvas id="scene"></canvas><div class="stat" style="margin-top:10px"><div>創世紀元<b id="time"></b></div><div>行星數量<b id="count"></b></div><div>生命星球<b id="living"></b></div><div>目前觀察<b id="focus"></b></div></div></div><div class="panel" id="planetPanel"><h2>🌍 星球環境與生態</h2><div class="row"><label>觀察星球 <select id="planetSelect"></select></label><span id="phase" class="pill"></span></div><div class="stat" id="env" style="margin-top:10px"></div><h2 style="margin-top:15px">物種與族群</h2><div id="species" class="species"></div></div><div class="panel"><h2>🧪 創世干預與任務</h2><p class="muted">干預改變環境條件，但不保證生命或文明必然出現。</p><div class="row"><button data-act="water">💧 添加水</button><button data-act="heat">☀ 提高溫度</button><button data-act="cool">❄ 降低溫度</button><button data-act="nutrients">🧬 添加有機物</button><button data-act="oxygen">🌿 增加氧氣</button><button data-act="meteor">☄ 隕石撞擊</button><button data-act="mutation">🧫 提高突變率</button></div><p id="mission"></p><button id="newMission">🎲 隨機新任務</button></div><div class="panel"><h2>⚙ 世界參數</h2><div class="controls"><label>重力 <span id="gVal"></span><input id="gravity" type="range" min="0.3" max="2" step="0.1"></label><label>密度 <span id="dVal"></span><input id="density" type="range" min="0.3" max="2" step="0.1"></label><label>自轉 <span id="sVal"></span><input id="spin" type="range" min="0.3" max="2" step="0.1"></label><label>幻想因子 <span id="mVal"></span><input id="magic" type="range" min="0" max="2" step="0.1"></label></div></div><div class="panel"><h2>📜 演化事件</h2><div id="log" class="log"></div></div><div class="panel"><h2>💾 世界存檔</h2><div class="row"><button id="save" class="primary">儲存到手機</button><button id="load">讀取手機存檔</button><button id="export">匯出 JSON</button><button id="import">匯入 JSON</button><input type="file" id="file" accept=".json,application/json" hidden></div><p class="muted">自動存檔只保存在此瀏覽器；更換裝置請匯出 JSON。舊版存檔可嘗試匯入創世參數。</p></div></main><footer>Genesis Universe V1.0 · 簡化 N-body 星系視覺 + 隨機生態演化模型 · 非精密天體物理模擬</footer><script>
(()=>{'use strict';const $=id=>document.getElementById(id),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),rnd=(a,b)=>a+Math.random()*(b-a),names=['阿爾法','薩芮','諾瓦','赫里奧','艾瑟','泰拉','克洛','伊甸'];let world,selected=2,view='space',paused=false,zoom=1,pan={x:0,y:0},last=performance.now(),frame=0,mission=0;const cv=$('scene'),ctx=cv.getContext('2d');const tasks=['觀察一顆星球形成液態海洋','協助一顆荒蕪星球建立宜居環境','等待第一種原始生命誕生','觀察一種生物族群繁衍','記錄一次物種滅絕或分化','尋找具備智慧潛力的生物'];const types=['漂浮濾食者','六足獵食者','群居甲殼獸','光合薄膜群','觸鬚游泳者','滑翔採集者','穴居分解者','晶殼微生物','枝狀固著生物','軟體掘穴者'];const colors=['#7de6a2','#d9a0f8','#f8b97b','#8cdbff','#f4e68a','#ff9aa5'];function makePlanet(i){return{id:i,name:names[i]||'P-'+i,orbit:75+i*43,angle:rnd(0,6.28),radius:4+i*1.5,mass:rnd(.4,2),water:clamp(rnd(.02,.9)-(i>4?.25:0),0,1),temp:rnd(-90,160)+(3-i)*18,oxygen:rnd(0,.12),nutrients:rnd(.1,.6),age:0,stage:0,life:[],mutation:1,seed:Math.random()*99999,events:0}}function initial(){return{version:'1.0',time:120.10599999999916,gravity:1,density:1,spin:1,magic:0,mass:1,planets:Array.from({length:6},(_,i)=>makePlanet(i)),events:['恆星已點火，原行星盤開始形成。','從創世紀元 120.106 百萬年接續演化。']}}function log(s){world.events.unshift('第 '+world.time.toFixed(3)+' 百萬年：'+s);world.events=world.events.slice(0,70)}function current(){return world.planets.find(p=>p.id===selected)||world.planets[0]}function habit(p){let t=Math.exp(-Math.pow((p.temp-22)/67,2)),w=clamp(p.water*1.7,0,1);return clamp(t*w*(.3+.7*p.nutrients)*(1+.15*world.magic),0,1)}function spawn(p){let typ=types[Math.floor(rnd(0,types.length))],id=p.life.length?Math.max(...p.life.map(x=>x.id))+1:1;let sp={id,name:typ+'-'+id,kind:typ,color:colors[Math.floor(rnd(0,colors.length))],pop:Math.floor(rnd(30,250)),energy:rnd(.3,.8),speed:rnd(.1,1.1),size:rnd(.4,1.5),social:rnd(0,1),predator:Math.random()<.25,intelligence:rnd(0,.2),x:rnd(.1,.9),y:rnd(.1,.9)};p.life.push(sp);log(p.name+' 出現新物種「'+sp.name+'」')}function evolve(dt){world.time+=dt;for(const p of world.planets){p.age+=dt;p.angle+=(dt*.008)/Math.sqrt(Math.pow(p.orbit/100,3));p.temp+=Math.sin(world.time*.0005+p.id)*dt*.004;p.temp=clamp(p.temp,-160,240);const h=habit(p);if(p.life.length===0){if(h>.14&&p.age>20&&Math.random()<dt*h*.008){spawn(p);p.stage=1;log(p.name+' 發生隨機生命起源事件')}}else{p.stage=Math.max(p.stage,1);for(let i=p.life.length-1;i>=0;i--){let s=p.life[i],r=(h-.19)*.045-(p.life.length*.0015)-(s.predator?.004:0);s.pop=Math.floor(clamp(s.pop*Math.exp(r*dt*3)+rnd(-1,1)*Math.sqrt(dt)*3,0,1e8));s.intelligence=clamp(s.intelligence+dt*.000015*Math.random()*(s.social+.1),0,1);s.x=clamp(s.x+rnd(-1,1)*dt*.001*s.speed,0,1);s.y=clamp(s.y+rnd(-1,1)*dt*.001*s.speed,0,1);if(s.pop<3){log(p.name+' 的 '+s.name+' 滅絕');p.life.splice(i,1)}}if(p.life.length<25&&p.life.length>0&&Math.random()<dt*.003*h*p.mutation){spawn(p)}if(p.life.some(s=>s.intelligence>.65&&s.pop>5000))p.stage=3;else if(p.life.length>2)p.stage=2;if(Math.random()<dt*.0003&&p.life.length){let s=p.life[Math.floor(rnd(0,p.life.length))];s.intelligence=clamp(s.intelligence+0.04,0,1);log(p.name+' 的 '+s.name+' 發生認知突變')}}p.oxygen=clamp(p.oxygen+dt*.00001*p.life.length,0,1);p.nutrients=clamp(p.nutrients-dt*.000005*p.life.length+dt*.000002,0,1)}}function intervention(act){const p=current();if(!p)return;const actions={water:()=>p.water=clamp(p.water+.15,0,1),heat:()=>p.temp+=18,cool:()=>p.temp-=18,nutrients:()=>p.nutrients=clamp(p.nutrients+.2,0,1),oxygen:()=>p.oxygen=clamp(p.oxygen+.1,0,1),meteor:()=>{p.temp+=rnd(8,35);p.water=clamp(p.water-.08,0,1);p.life.forEach(s=>s.pop=Math.floor(s.pop*rnd(.2,.8)))},mutation:()=>p.mutation=clamp(p.mutation+.5,1,6)};actions[act]();log('對 '+p.name+' 施加「'+({water:'水資源',heat:'升溫',cool:'降溫',nutrients:'有機物',oxygen:'氧氣',meteor:'隕石撞擊',mutation:'突變加速'}[act])+'」干預');update()}function setView(v){view=v;$('spaceBtn').className=v==='space'?'primary':'';$('surfaceBtn').className=v==='surface'?'primary':'';$('hint').textContent=v==='space'?'拖曳平移、雙指縮放，點選行星進入詳細觀察。':'生物會依族群數量、移動能力及群居性形成動態分布。';update()}function render(){let w=cv.clientWidth,h=cv.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.fillStyle='#030918';ctx.fillRect(0,0,w,h);if(view==='space'){for(let i=0;i<100;i++){let x=((i*137.5+19)%997)/997*w,y=((i*79.7+31)%811)/811*h;ctx.fillStyle='rgba(180,210,255,.4)';ctx.fillRect(x,y,1,1)}let cx=w/2+pan.x,cy=h/2+pan.y,scale=Math.min(w/650,h/600)*zoom;ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);for(const p of world.planets){ctx.beginPath();ctx.ellipse(0,0,p.orbit,p.orbit*.73,0,0,Math.PI*2);ctx.strokeStyle='#24334e';ctx.lineWidth=1/scale;ctx.stroke()}let sun=ctx.createRadialGradient(0,0,3,0,0,52);sun.addColorStop(0,'#fff4c0');sun.addColorStop(.25,'#ffbe59');sun.addColorStop(1,'rgba(255,114,25,0)');ctx.fillStyle=sun;ctx.beginPath();ctx.arc(0,0,52,0,7);ctx.fill();for(const p of world.planets){let x=Math.cos(p.angle)*p.orbit,y=Math.sin(p.angle)*p.orbit*.73;ctx.fillStyle=p.water>.4?'#5bb9cf':p.temp>75?'#dc865c':'#b5a48a';ctx.beginPath();ctx.arc(x,y,p.radius+2,0,7);ctx.fill();if(p.id===selected){ctx.strokeStyle='#fff';ctx.lineWidth=2/scale;ctx.beginPath();ctx.arc(x,y,p.radius+7,0,7);ctx.stroke()}ctx.fillStyle='#dbe7ff';ctx.font='12px sans-serif';ctx.fillText(p.name,x+10,y-8)}ctx.restore()}else{const p=current(),cx=w/2,cy=h/2,R=Math.min(w*.44,h*.43);let grad=ctx.createRadialGradient(cx-R*.2,cy-R*.25,2,cx,cy,R);grad.addColorStop(0,p.water>.2?'#3287a0':'#9b7760');grad.addColorStop(.8,p.water>.2?'#104867':'#6b4d43');grad.addColorStop(1,'#0b2038');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();ctx.save();ctx.beginPath();ctx.arc(cx,cy,R-3,0,7);ctx.clip();for(let i=0;i<22;i++){let a=i*2.4+p.seed,x=cx+Math.sin(a)*R*.85,y=cy+Math.cos(a*1.6)*R*.82;ctx.fillStyle=p.water>.3?'rgba(68,170,111,.3)':'rgba(208,170,100,.2)';ctx.beginPath();ctx.ellipse(x,y,R*.3,R*.15,a,0,7);ctx.fill()}for(const s of p.life){let n=Math.min(60,Math.ceil(Math.log10(s.pop+1)*8));for(let i=0;i<n;i++){let a=i*2.399+s.id*5,rr=Math.sqrt((i+.5)/n)*R*.7*s.social+R*.08*(1-s.social),x=cx+(s.x-.5)*R+Math.cos(a+frame*.002*s.speed)*rr,y=cy+(s.y-.5)*R+Math.sin(a+frame*.002*s.speed)*rr;if((x-cx)**2+(y-cy)**2>R*R)continue;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(x,y,clamp(s.size*2.1,1.2,4),0,7);ctx.fill()}}ctx.restore();ctx.strokeStyle='#78b9dc';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();ctx.fillStyle='#d8edff';ctx.font='14px sans-serif';ctx.fillText(p.name+' · '+p.life.length+' 種生物',14,24)}}function update(){const p=current();$('time').textContent=world.time.toFixed(3)+' 百萬年';$('count').textContent=world.planets.length;$('living').textContent=world.planets.filter(x=>x.life.length).length;$('focus').textContent=p.name;$('planetSelect').innerHTML=world.planets.map(x=>'<option value="'+x.id+'" '+(x.id===selected?'selected':'')+'>'+x.name+'</option>').join('');$('phase').textContent=['無生命','原始生命','複雜生態','智慧萌芽'][p.stage]||'演化中';$('env').innerHTML=[['溫度',p.temp.toFixed(1)+' °C'],['水資源',(p.water*100).toFixed(0)+'%'],['氧氣',(p.oxygen*100).toFixed(1)+'%'],['宜居指數',(habit(p)*100).toFixed(0)+'%'],['有機養分',(p.nutrients*100).toFixed(0)+'%'],['生物總數',p.life.reduce((a,s)=>a+s.pop,0).toLocaleString()]].map(x=>'<div>'+x[0]+'<b>'+x[1]+'</b></div>').join('');$('species').innerHTML=p.life.length?p.life.map(s=>'<article><strong>● '+s.name+'</strong><div>族群：'+s.pop.toLocaleString()+'</div><div>行為：'+(s.predator?'捕食':'採集／濾食')+' · '+(s.social>.5?'群居':'獨居')+'</div><div>智慧：'+(s.intelligence*100).toFixed(1)+'%</div></article>').join(''):'<p class="muted">尚未出現生命。可增加水、有機物或推進時間，等待隨機生命起源。</p>';$('log').innerHTML=world.events.slice(0,35).map(x=>'<div>'+x.replaceAll('<','&lt;')+'</div>').join('');$('mission').textContent='目前任務：'+tasks[mission];for(const [key,id] of [['gravity','gVal'],['density','dVal'],['spin','sVal'],['magic','mVal']]){$(key).value=world[key];$(id).textContent=Number(world[key]).toFixed(1)}}function save(){try{localStorage.setItem('genesis-universe-v1',JSON.stringify(world));return true}catch(e){alert('無法儲存：'+e.message);return false}}function restore(o){if(!o||typeof o!=='object')throw Error('無效 JSON');let base=initial();for(let k of ['time','gravity','density','spin','magic','mass'])if(Number.isFinite(+o[k]))base[k]=+o[k];if(Array.isArray(o.planets)&&o.planets.length&&o.planets.every(p=>typeof p==='object'&&Array.isArray(p.life)))base.planets=o.planets;else base.events.unshift('已匯入舊世界的創世參數，並重新建立行星生態。');if(Array.isArray(o.events))base.events=o.events.slice(0,70);world=base;selected=world.planets[0].id;update()}$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ 繼續':'⏸ 暫停';$('status').textContent=paused?'Ⅱ 已暫停':'● 運轉中'};$('spaceBtn').onclick=()=>setView('space');$('surfaceBtn').onclick=()=>setView('surface');$('planetSelect').onchange=e=>{selected=+e.target.value;setView('surface')};document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>intervention(b.dataset.act));$('newMission').onclick=()=>{mission=(mission+1+Math.floor(Math.random()*(tasks.length-1)))%tasks.length;update()};for(let k of ['gravity','density','spin','magic'])$(k).oninput=e=>{world[k]=+e.target.value;update()};$('save').onclick=()=>{if(save())alert('世界已儲存於目前瀏覽器')};$('load').onclick=()=>{try{let x=localStorage.getItem('genesis-universe-v1');if(!x)return alert('找不到本機存檔');restore(JSON.parse(x))}catch(e){alert('讀取失敗：'+e.message)}};$('export').onclick=()=>{let a=document.createElement('a'),blob=new Blob([JSON.stringify(world,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='Genesis-Universe-V1-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let f=e.target.files[0];if(f)restore(JSON.parse(await f.text()))}catch(err){alert('匯入失敗：'+err.message)}e.target.value=''};let pointer=null,pinch=null;cv.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY,moved:false};cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!pointer)return;let dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.abs(dx)+Math.abs(dy)>3)pointer.moved=true;if(view==='space'){pan.x+=dx;pan.y+=dy}pointer.x=e.clientX;pointer.y=e.clientY});cv.addEventListener('pointerup',e=>{if(!pointer)return;if(!pointer.moved&&view==='space'){let r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,scale=Math.min(r.width/650,r.height/600)*zoom,cx=r.width/2+pan.x,cy=r.height/2+pan.y;let closest=null,dist=1e9;for(let p of world.planets){let px=cx+Math.cos(p.angle)*p.orbit*scale,py=cy+Math.sin(p.angle)*p.orbit*.73*scale,d=Math.hypot(x-px,y-py);if(d<dist){dist=d;closest=p}}if(dist<25&&closest){selected=closest.id;setView('surface')}}pointer=null});cv.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*(e.deltaY>0?.9:1.1),.4,3)},{passive:false});cv.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});cv.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){let n=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom=clamp(zoom*n/pinch,.4,3);pinch=n}},{passive:true});cv.addEventListener('touchend',()=>pinch=null);try{let s=localStorage.getItem('genesis-universe-v1');if(s)restore(JSON.parse(s));else{world=initial();update()}}catch(e){world=initial();update()}let acc=0,autosave=0;function loop(t){let elapsed=Math.min((t-last)/1000,.1);last=t;frame++;if(!paused){acc+=elapsed;let speed=+$('speed').value;let simulated=elapsed*speed/50000;let chunks=Math.max(1,Math.ceil(simulated/5));for(let i=0;i<chunks;i++)evolve(simulated/chunks);autosave+=elapsed;if(acc>.5){update();acc=0}if(autosave>12){save();autosave=0}}render();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
