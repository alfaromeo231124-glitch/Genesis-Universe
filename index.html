<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Genesis V0.2 — 3D 宇宙沙盒</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b16;color:#edf3ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{height:54px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;background:#10182b;border-bottom:1px solid #293955}header b{font-size:17px}header span{font-size:12px;color:#a8b8d5}main{display:grid;grid-template-columns:minmax(0,1fr) 315px;height:calc(100dvh - 54px)}#view{position:relative;overflow:hidden;touch-action:none;background:#030713}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;top:12px;left:12px;font-size:12px;line-height:1.8;pointer-events:none;text-shadow:0 1px 4px #000}.hud em{color:#9cddff;font-style:normal}aside{overflow:auto;background:#111a2e;padding:12px;border-left:1px solid #293955}.panel{background:#19253e;border:1px solid #304362;border-radius:12px;padding:12px;margin-bottom:10px}.panel h2{font-size:14px;margin:0 0 10px}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:8px 0}button,select,input{font:inherit}button,select{background:#2a3a5b;color:#fff;border:1px solid #486087;border-radius:8px;padding:8px 10px;font-size:12px}button.primary{background:#6355cc;border-color:#8578ec}button:active{filter:brightness(1.3)}label{display:block;font-size:12px;color:#c8d7f3;margin:10px 0 4px}input[type=range]{width:100%;accent-color:#9b8aff}input[type=number]{width:100%;padding:8px;background:#0b1426;color:#fff;border:1px solid #456080;border-radius:7px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{background:#0c172b;border-radius:8px;padding:8px;font-size:11px;color:#acbddd}.stat b{display:block;font-size:16px;color:#fff;margin-top:3px}.foot{font-size:11px;line-height:1.5;color:#a4b6d0}#toast{color:#a4f4c8;min-height:20px;font-size:12px}@media(max-width:760px){main{display:flex;flex-direction:column}#view{height:54%;min-height:290px;flex:none}aside{flex:1;border-left:0;border-top:1px solid #304362}header span{display:none}}
</style></head><body><header><b>✦ Genesis <span>V0.2 · 3D 宇宙沙盒</span></b><span>創世世界 001 · 即時 N-body</span></header><main><section id="view"><canvas id="sky"></canvas><div class="hud"><div id="status">● 即時運轉中</div><div id="age">創世紀元：120.106 萬年</div><div><em>單指旋轉 · 雙指縮放/平移 · 點擊選取</em></div></div></section><aside>
<div class="panel"><h2>時間與視角</h2><div class="row"><button class="primary" id="pause">Ⅱ 暫停</button><select id="speed"><option value=".1">0.1×</option><option value="1" selected>1×</option><option value="10">10×</option><option value="100">100×</option></select><button id="home">重置視角</button></div><label>鏡頭距離 <span id="zoomLabel">1.0×</span></label><input type="range" id="zoom" min=".25" max="6" step=".05" value="1"><div class="row"><button id="top">俯視</button><button id="side">側視</button><button id="follow">追蹤選取</button></div><div class="stats"><div class="stat">天體數<b id="count">0</b></div><div class="stat">模擬經過<b id="elapsed">0 年</b></div><div class="stat">碰撞次數<b id="collisions">0</b></div><div class="stat">選取天體<b id="chosen">無</b></div></div></div>
<div class="panel"><h2>創世物理參數</h2><label>重力倍率 <span id="gLabel">1.0×</span></label><input id="gravity" type="range" min=".1" max="3" step=".1" value="1"><label>軌道擾動 <span id="chaosLabel">0%</span></label><input id="chaos" type="range" min="0" max="100" step="5" value="0"><div class="row"><label><input id="trails" type="checkbox" checked> 軌跡</label><label><input id="orbits" type="checkbox" checked> 軌道參考線</label><label><input id="labels" type="checkbox" checked> 名稱</label></div></div>
<div class="panel"><h2>創造行星</h2><label>質量（地球質量）</label><input id="newMass" type="number" min=".01" max="3000" step=".1" value="1"><label>距離（AU）</label><input id="newRadius" type="number" min=".15" max="40" step=".1" value="2.8"><label>公轉速度倍率</label><input id="newVelocity" type="number" min="0" max="3" step=".05" value="1"><div class="row"><button class="primary" id="add">＋ 新增行星</button><button id="random">重建星系</button></div></div>
<div class="panel"><h2>天體觀測與演化</h2><div id="details" class="foot">點擊行星觀察地表與環境。</div><div class="row"><button id="remove">刪除選取</button></div></div>
<div class="panel"><h2>世界存檔</h2><div class="row"><button class="primary" id="save">儲存</button><button id="load">讀取</button><button id="export">匯出 JSON</button></div><label>匯入世界檔案 <input type="file" id="import" accept=".json,application/json"></label><div id="toast"></div><div class="foot">V0.2 採三維位置、三維速度與牛頓 N-body 積分；使用 Canvas 2D 投影繪製立體球面、光照與相機旋轉，無需外部套件。溫度、海洋與地表為簡化幻想模型，不代表精確地球物理。舊版 V0.1 存檔可匯入。</div></div>
</aside></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('sky'),ctx=canvas.getContext('2d'),AU=149597870700,YEAR=31557600,MS=1.98847e30,ME=5.9722e24,G=6.67430e-11;let bodies=[],selected=null,paused=false,sim=0,collisions=0,grav=1,zoom=1,az=.65,el=.65,panX=0,panY=0,follow=false,seed=42,nextId=1,last=performance.now(),tick=0,chaos=0;let pointers=new Map(),gesture=null;const initState={time:120.10599999999916,gravity:1,density:1,spin:1,magic:0,mass:1};function rng(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function radius(m,star){return star?696340000*Math.cbrt(m/MS):6371000*Math.cbrt(m/ME)}function make(name,m,x,y,z,vx,vy,vz,color,star=false){return{id:nextId++,name,mass:m,x,y,z,vx,vy,vz,color,star,radius:radius(m,star),trail:[],phase:rng()*6.28}}function init(){nextId=1;bodies=[make('創世恆星',MS,0,0,0,0,0,0,'#ffe4a0',true)];[[.42,.35,'#bda9a0'],[.82,.9,'#c7b28b'],[1.18,1.05,'#4bb7d6'],[1.7,.6,'#d98362'],[3.1,13,'#e4bb87'],[5.2,24,'#d7c49a']].forEach(([r,m,c],i)=>{let a=i*2.399,d=r*AU,v=Math.sqrt(G*MS/d),inc=(i%3-1)*.025;bodies.push(make('P-'+String(i+1).padStart(2,'0'),m*ME,Math.cos(a)*d,Math.sin(a)*d,0,-Math.sin(a)*v,Math.cos(a)*v,inc*v,c))});selected=bodies[3].id;sim=0;collisions=0;zoom=1;az=.65;el=.65;panX=panY=0;follow=false;$('zoom').value=1;ui()}
function project(b){const ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el),x=b.x/AU,y=b.y/AU,z=b.z/AU;const xr=ca*x-sa*y,yr=sa*x+ca*y;const yy=ce*yr-se*z,depth=se*yr+ce*z;const scale=Math.min(canvas.clientWidth,canvas.clientHeight)*.43/6*zoom;return{x:canvas.clientWidth/2+panX+xr*scale,y:canvas.clientHeight/2+panY+yy*scale,depth,scale}}
function accelerations(){const n=bodies.length,a=Array.from({length:n},()=>[0,0,0]);for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const p=bodies[i],q=bodies[j],dx=q.x-p.x,dy=q.y-p.y,dz=q.z-p.z,rr=dx*dx+dy*dy+dz*dz+4e14,inv=G*grav/(rr*Math.sqrt(rr));for(let k=0;k<3;k++){let d=[dx,dy,dz][k];a[i][k]+=inv*q.mass*d;a[j][k]-=inv*p.mass*d}}return a}
function step(dt){let a=accelerations();bodies.forEach((b,i)=>{b.vx+=a[i][0]*dt/2;b.vy+=a[i][1]*dt/2;b.vz+=a[i][2]*dt/2;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt});a=accelerations();bodies.forEach((b,i)=>{b.vx+=a[i][0]*dt/2;b.vy+=a[i][1]*dt/2;b.vz+=a[i][2]*dt/2});for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){const p=bodies[i],q=bodies[j];if(Math.hypot(p.x-q.x,p.y-q.y,p.z-q.z)<p.radius+q.radius){const big=p.mass>=q.mass?p:q,small=big===p?q:p,M=big.mass+small.mass;for(const k of ['x','y','z','vx','vy','vz'])big[k]=(big[k]*big.mass+small[k]*small.mass)/M;big.mass=M;big.star=big.star||small.star;big.radius=radius(M,big.star);big.trail=[];if(selected===small.id)selected=big.id;bodies.splice(bodies.indexOf(small),1);collisions++;j--}}sim+=dt}
function drawSphere(p,r,b){const x=p.x,y=p.y,star=b.star;ctx.save();if(star){let glow=ctx.createRadialGradient(x,y,1,x,y,r*5);glow.addColorStop(0,'rgba(255,249,210,.9)');glow.addColorStop(.2,'rgba(255,170,70,.5)');glow.addColorStop(1,'rgba(255,100,20,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,r*5,0,7);ctx.fill()}ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.clip();let gr=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.05,x+r*.25,y+r*.25,r*1.55);gr.addColorStop(0,star?'#fffce8':b.color);gr.addColorStop(.55,star?'#ffce68':b.color);gr.addColorStop(1,star?'#a8471d':'#07101e');ctx.fillStyle=gr;ctx.fillRect(x-r,y-r,r*2,r*2);if(!star){let hash=b.id*19;ctx.globalAlpha=.35;for(let i=0;i<6;i++){let yy=y-r+(i+1)*r/3+Math.sin(hash+i)*r*.1;ctx.fillStyle=i%2?'#b2d6c4':'#202947';ctx.beginPath();ctx.ellipse(x+Math.sin(hash+i*2)*r*.25,yy,r*(.5+.2*Math.sin(i+hash)),r*.09,Math.sin(i)*.3,0,7);ctx.fill()}ctx.globalAlpha=1}ctx.restore();if(b.id===selected){ctx.strokeStyle='#e4ddff';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y,r+5,0,7);ctx.stroke()}}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#030713';ctx.fillRect(0,0,w,h);for(let i=0;i<210;i++){let x=((i*193.7+17)%997)/997*w,y=((i*317.3+29)%991)/991*h;ctx.fillStyle='rgba(205,220,255,.3)';ctx.fillRect(x,y,i%11?1:1.5,i%11?1:1.5)}const star=bodies.find(b=>b.star);if(follow){const b=bodies.find(b=>b.id===selected);if(b){const p=project(b);panX+=w/2-p.x;panY+=h/2-p.y}}if($('orbits').checked&&star){for(let i=1;i<=7;i++){ctx.beginPath();for(let j=0;j<=140;j++){const a=j/140*Math.PI*2,p=project({x:Math.cos(a)*i*AU,y:Math.sin(a)*i*AU,z:0});j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.strokeStyle='rgba(117,143,210,.12)';ctx.lineWidth=.7;ctx.stroke()}}if($('trails').checked)for(const b of bodies){if(b.trail.length<2)continue;ctx.beginPath();b.trail.forEach((q,i)=>{const p=project({x:q[0],y:q[1],z:q[2]});i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.strokeStyle=b.color+'99';ctx.lineWidth=1;ctx.stroke()}const items=bodies.map(b=>({b,p:project(b)})).sort((a,b)=>a.p.depth-b.p.depth);for(const {b,p} of items){const r=b.star?12:Math.max(4,Math.min(20,3+Math.cbrt(b.mass/ME)*2));drawSphere(p,r,b);if($('labels').checked){ctx.fillStyle='#cbd8f0';ctx.font='11px system-ui';ctx.fillText(b.name,p.x+r+5,p.y-5)}}}
function ui(){$('count').textContent=bodies.length;$('elapsed').textContent=(sim/YEAR).toFixed(2)+' 年';$('age').textContent='創世紀元：'+(120.10599999999916+sim/YEAR/10000).toFixed(6)+' 萬年';$('collisions').textContent=collisions;const b=bodies.find(b=>b.id===selected);$('chosen').textContent=b?.name||'無';if(!b){$('details').textContent='點擊行星觀察環境。';return}const star=bodies.find(x=>x.star),d=star&&star!==b?Math.hypot(b.x-star.x,b.y-star.y,b.z-star.z)/AU:0,temp=d?278*Math.pow(star.mass/MS,.25)/Math.sqrt(d):0;const ocean=!b.star&&temp>245&&temp<350&&b.mass/ME>.3?'可能有液態水':'未確認液態水';const atmosphere=b.star?'恆星電漿':b.mass/ME>2?'較厚大氣可能':b.mass/ME>.3?'可能保有大氣':'稀薄或無大氣';$('details').textContent=`${b.name}｜${b.star?'恆星':'行星'}\n質量：${(b.mass/(b.star?MS:ME)).toFixed(3)} ${b.star?'M☉':'M⊕'}\n距離恆星：${d.toFixed(3)} AU\n速度：${(Math.hypot(b.vx,b.vy,b.vz)/1000).toFixed(2)} km/s\n估計平衡溫度：${temp?temp.toFixed(0)+' K':'—'}\n環境推測：${b.star?'核融合持續':' '+ocean+'；'+atmosphere}`;$('details').style.whiteSpace='pre-line'}
function loop(now){let delta=Math.min(.05,(now-last)/1000);last=now;if(!paused){let total=delta*YEAR*.025*Number($('speed').value),n=Math.max(1,Math.min(100,Math.ceil(total/(YEAR*.001))));for(let i=0;i<n;i++)step(total/n);if(tick%3===0)for(const b of bodies){b.trail.push([b.x,b.y,b.z]);if(b.trail.length>300)b.trail.shift()}}draw();if(tick++%12===0)ui();requestAnimationFrame(loop)}
function toast(t){$('toast').textContent=t;setTimeout(()=>{if($('toast').textContent===t)$('toast').textContent=''},3500)}function setZoom(v){zoom=Math.max(.25,Math.min(6,v));$('zoom').value=zoom;$('zoomLabel').textContent=zoom.toFixed(2)+'×'}$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ 繼續':'Ⅱ 暫停';$('status').textContent=paused?'● 已暫停':'● 即時運轉中'};$('gravity').oninput=e=>{grav=Number(e.target.value);$('gLabel').textContent=grav.toFixed(1)+'×'};$('chaos').oninput=e=>{$('chaosLabel').textContent=e.target.value+'%';let newChaos=Number(e.target.value)/100,diff=newChaos-chaos;chaos=newChaos;if(diff>0){for(const b of bodies)if(!b.star){b.vz+=(rng()-.5)*diff*12000;b.vx+=(rng()-.5)*diff*6000}}};$('zoom').oninput=e=>setZoom(Number(e.target.value));$('home').onclick=()=>{az=.65;el=.65;panX=panY=0;follow=false;setZoom(1)};$('top').onclick=()=>{az=0;el=0;follow=false};$('side').onclick=()=>{az=0;el=1.5;follow=false};$('follow').onclick=()=>{follow=!follow;toast(follow?'已開啟追蹤':'已停止追蹤')};$('add').onclick=()=>{let m=Number($('newMass').value),r=Number($('newRadius').value),v=Number($('newVelocity').value);if(!Number.isFinite(m)||!Number.isFinite(r)||!Number.isFinite(v)||m<=0||r<=0||v<0)return toast('請輸入有效參數');let s=bodies.find(b=>b.star);if(!s)return toast('目前沒有恆星');let a=rng()*6.28,d=r*AU,spd=Math.sqrt(G*grav*s.mass/d)*v;let b=make('P-'+String(nextId).padStart(2,'0'),m*ME,s.x+Math.cos(a)*d,s.y+Math.sin(a)*d,(rng()-.5)*d*.03,s.vx-Math.sin(a)*spd,s.vy+Math.cos(a)*spd,s.vz,['#66bada','#dfaa82','#c6a6eb','#8ac8a5'][Math.floor(rng()*4)]);bodies.push(b);selected=b.id;ui();toast('已新增 '+b.name)};$('random').onclick=()=>{if(confirm('重建星系？請先儲存目前世界。')){seed=(Date.now()>>>0);init();toast('已重建星系')}};$('remove').onclick=()=>{let b=bodies.find(x=>x.id===selected);if(!b||b.star)return toast('不能刪除中央恆星');bodies=bodies.filter(x=>x.id!==selected);selected=null;ui()};function snapshot(){return{version:2,initial:initState,simSeconds:sim,gravity:grav,zoom,az,el,panX,panY,collisions,seed,nextId,selected,chaos,bodies}}function restore(s){if(![1,2].includes(s.version)||!Array.isArray(s.bodies)||s.bodies.length>1000||!s.bodies.every(b=>['mass','x','y','vx','vy'].every(k=>Number.isFinite(b[k]))&&b.mass>0))throw Error('存檔格式不正確');bodies=s.bodies.map(b=>({...b,z:Number(b.z)||0,vz:Number(b.vz)||0,trail:Array.isArray(b.trail)?b.trail.slice(-300).map(p=>[p[0],p[1],p[2]||0]):[],radius:radius(b.mass,b.star)}));sim=Number(s.simSeconds)||0;grav=Number(s.gravity)||1;zoom=Number(s.zoom)||1;az=Number(s.az??.65);el=Number(s.el??.65);panX=Number(s.panX)||0;panY=Number(s.panY)||0;collisions=Number(s.collisions)||0;seed=Number(s.seed)||42;chaos=Number(s.chaos)||0;nextId=Math.max(Number(s.nextId)||1,...bodies.map(b=>b.id+1));selected=s.selected;$('gravity').value=grav;$('gLabel').textContent=grav.toFixed(1)+'×';$('chaos').value=chaos*100;$('chaosLabel').textContent=Math.round(chaos*100)+'%';setZoom(zoom);ui()};$('save').onclick=()=>{try{localStorage.setItem('genesis-world-v02',JSON.stringify(snapshot()));toast('已儲存至此瀏覽器')}catch(e){toast(e.message)}};$('load').onclick=()=>{try{let s=localStorage.getItem('genesis-world-v02')||localStorage.getItem('genesis-world-001');if(!s)return toast('找不到存檔');restore(JSON.parse(s));toast('世界已載入')}catch(e){toast(e.message)}};$('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='genesis-world-v02.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onchange=async e=>{try{let f=e.target.files?.[0];if(f){restore(JSON.parse(await f.text()));toast('匯入成功')}}catch(err){toast('匯入失敗：'+err.message)}e.target.value=''};
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)gesture={x:e.clientX,y:e.clientY,az,el,panX,panY,zoom,moved:false};else gesture=null});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});let ps=[...pointers.values()];if(ps.length===1&&gesture){let dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.hypot(dx,dy)>4)gesture.moved=true;az=gesture.az+dx*.007;el=Math.max(-1.5,Math.min(1.5,gesture.el+dy*.007));follow=false}else if(ps.length===2){const other=ps.find(p=>p!==pointers.get(e.pointerId));if(other){const prev=Math.hypot(old.x-other.x,old.y-other.y),now=Math.hypot(e.clientX-other.x,e.clientY-other.y);if(prev>10)setZoom(zoom*now/prev);panX+=(e.clientX-old.x)*.5;panY+=(e.clientY-old.y)*.5}}});canvas.addEventListener('pointerup',e=>{let moved=gesture?.moved||pointers.size>1;pointers.delete(e.pointerId);if(!moved){let rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,best=null,dmin=25;for(const b of bodies){let p=project(b),d=Math.hypot(x-p.x,y-p.y);if(d<dmin){best=b;dmin=d}}selected=best?.id??null;ui()}if(!pointers.size)gesture=null;else{let p=[...pointers.values()][0];gesture={x:p.x,y:p.y,az,el,panX,panY,zoom,moved:true}}});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);gesture=null});canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*(e.deltaY>0?.9:1.1))},{passive:false});init();requestAnimationFrame(loop);
})();</script></body></html>
